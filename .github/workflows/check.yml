name: Event Log documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node event-log/verify.mjs
      - run: npm ci
        working-directory: _archive/original
      - run: npm run verify
        working-directory: _archive/original
