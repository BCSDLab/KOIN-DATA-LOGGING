name: 주간 로깅 검수

on:
  schedule:
    - cron: '0 0 * * 1' # 월요일 09:00 Asia/Seoul
  workflow_dispatch:
    inputs:
      week_start:
        description: '검수 대상 주의 월요일 YYYY-MM-DD (비우면 직전 완료 주)'
        required: false
        type: string
      send_slack:
        description: 'Stage 채널에 Stage/Prod 결과 전송'
        type: boolean
        default: true
      api_smoke_only:
        description: '합성 계약으로 AI API만 시험 (BigQuery·Slack 실행 안 함)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: weekly-logging-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: automation/logging-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/logging-audit/requirements.txt
      - name: 검수 주 결정
        if: ${{ !inputs.api_smoke_only }}
        id: week
        env:
          REQUESTED_WEEK: ${{ inputs.week_start }}
        run: |
          args=()
          if [[ -n "$REQUESTED_WEEK" ]]; then args+=(--week-start "$REQUESTED_WEEK"); fi
          week="$(python run.py --print-week-start "${args[@]}")"
          echo "start=$week" >> "$GITHUB_OUTPUT"
      - name: 전송 상태 복원
        if: ${{ !inputs.api_smoke_only }}
        id: receipt
        uses: actions/cache/restore@v4
        with:
          path: automation/logging-audit/.audit-state
          key: logging-audit-delivery-${{ steps.week.outputs.start }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            logging-audit-delivery-${{ steps.week.outputs.start }}-
      - name: 검사 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: Google Cloud 인증 (Workload Identity)
        if: ${{ !inputs.api_smoke_only && vars.GCP_AUDIT_WIF_PROVIDER != '' && vars.GCP_AUDIT_SERVICE_ACCOUNT != '' }}
        id: wif
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_AUDIT_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_AUDIT_SERVICE_ACCOUNT }}
      - name: Google Cloud 인증 (기존 전용 계정 키)
        if: ${{ !inputs.api_smoke_only && vars.GCP_AUDIT_WIF_PROVIDER == '' }}
        id: key
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_AUDIT_CREDENTIALS_JSON }}
      - name: GitHub main 명세·Stage/Prod DA1·DA2 및 기존 event_name 검사
        if: ${{ always() && !inputs.api_smoke_only && steps.week.outcome == 'success' }}
        env:
          SLACK_LOGGING_AUDIT_STAGE_WEBHOOK: ${{ secrets.SLACK_LOGGING_AUDIT_STAGE_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AGENT_MODEL: ${{ vars.OPENAI_AGENT_MODEL || 'gpt-6-astra' }}
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
          AUDIT_WEEK: ${{ steps.week.outputs.start }}
          SEND_SLACK: ${{ github.event_name == 'schedule' || inputs.send_slack }}
        run: |
          args=()
          if [[ "$SEND_SLACK" == "true" ]]; then args+=(--send); fi
          python run.py --week-start "$AUDIT_WEEK" "${args[@]}"
      - name: AI API 합성 계약 시험 (Slack·BigQuery 없음)
        if: ${{ inputs.api_smoke_only }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AGENT_MODEL: ${{ vars.OPENAI_AGENT_MODEL || 'gpt-6-astra' }}
        run: python api_smoke.py
      - name: 전송 상태 보존
        if: ${{ always() && !inputs.api_smoke_only && steps.week.outcome == 'success' && steps.receipt.outputs.cache-hit != 'true' && hashFiles('automation/logging-audit/.audit-state/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: automation/logging-audit/.audit-state
          key: logging-audit-delivery-${{ steps.week.outputs.start }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 상세 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logging-audit-results-${{ steps.week.outputs.start }}
          path: automation/logging-audit/reports/
          if-no-files-found: warn
          retention-days: 35
