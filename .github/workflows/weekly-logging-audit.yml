name: 주간 로깅 검수

on:
  schedule:
    - cron: '0 0 * * 1' # 월요일 09:00 Asia/Seoul
  workflow_dispatch:
    inputs:
      week_start:
        description: '검수 대상 주의 월요일 YYYY-MM-DD (비우면 직전 완료 주)'
        required: false
        type: string
      send_slack:
        description: '기존 채널에 Stage/Prod 결과 전송'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: weekly-logging-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: automation/logging-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/logging-audit/requirements.txt
      - name: 검수 주 결정
        id: week
        env:
          REQUESTED_WEEK: ${{ inputs.week_start }}
        run: |
          args=()
          if [[ -n "$REQUESTED_WEEK" ]]; then args+=(--week-start "$REQUESTED_WEEK"); fi
          week="$(python run.py --print-week-start "${args[@]}")"
          echo "start=$week" >> "$GITHUB_OUTPUT"
      - name: 전송 상태 복원
        id: receipt
        uses: actions/cache/restore@v4
        with:
          path: automation/logging-audit/.audit-state
          key: logging-audit-delivery-${{ steps.week.outputs.start }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            logging-audit-delivery-${{ steps.week.outputs.start }}-
      - name: 검사 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: Google Cloud 인증 (Workload Identity)
        if: vars.GCP_AUDIT_WIF_PROVIDER != '' && vars.GCP_AUDIT_SERVICE_ACCOUNT != ''
        id: wif
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_AUDIT_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_AUDIT_SERVICE_ACCOUNT }}
      - name: Google Cloud 인증 (기존 전용 계정 키)
        if: vars.GCP_AUDIT_WIF_PROVIDER == ''
        id: key
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_AUDIT_CREDENTIALS_JSON }}
      - name: Notion 전체 명세와 Stage/Prod DA1·DA2 검사
        if: always() && steps.week.outcome == 'success'
        env:
          NOTION_LOGGING_READ_TOKEN: ${{ secrets.NOTION_LOGGING_READ_TOKEN }}
          SLACK_LOGGING_AUDIT_WEBHOOK: ${{ secrets.SLACK_LOGGING_AUDIT_WEBHOOK }}
          AUDIT_WEEK: ${{ steps.week.outputs.start }}
          SEND_SLACK: ${{ github.event_name == 'schedule' || inputs.send_slack }}
        run: |
          args=()
          if [[ "$SEND_SLACK" == "true" ]]; then args+=(--send); fi
          python run.py --week-start "$AUDIT_WEEK" "${args[@]}"
      - name: 전송 상태 보존
        if: always() && steps.week.outcome == 'success' && steps.receipt.outputs.cache-hit != 'true' && hashFiles('automation/logging-audit/.audit-state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: automation/logging-audit/.audit-state
          key: logging-audit-delivery-${{ steps.week.outputs.start }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 상세 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logging-audit-results-${{ steps.week.outputs.start }}
          path: automation/logging-audit/reports/
          if-no-files-found: warn
          retention-days: 35
